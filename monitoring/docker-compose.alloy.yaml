name: grafana-alloy

services:
  alloy:
    image: grafana/alloy:v1.21.3
    container_name: grafana-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      NODE_NAME: ${NODE_NAME:?define NODE_NAME in alloy.env}
      LOKI_URL: ${LOKI_URL:?define LOKI_URL in alloy.env}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

  # Métricas de la EC2 (CPU, RAM, disco) para Prometheus; el SG de cada rol abre 9100 solo a sg-monitoring
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/.+)($$|/)
    volumes:
      - /:/host:ro,rslave

volumes:
  alloy-data:
