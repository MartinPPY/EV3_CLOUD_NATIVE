# Reglas del JMX Prometheus javaagent para ZooKeeper (puerto 9405).
# Nombres por defecto: org_apache_ZooKeeperService_StandaloneServer_port2181_* (NumAliveConnections,
# OutstandingRequests, PacketsReceived...) y, por conexión, ..._AvgLatency con labels name1/name2/name3.
lowercaseOutputName: false
lowercaseOutputLabelNames: false
whitelistObjectNames:
  - "org.apache.ZooKeeperService:*"
  - "java.lang:*"
rules:
  - pattern: ".*"
